name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake build-essential jq

      - name: Install Buildozer
        run: pip install buildozer==1.5.0 "cython<3" virtualenv

      - name: Download model files
        run: |
          python3 download_models.py
          test $(ls models | wc -l) -ge 9 || (echo "Some models failed to download" && exit 1)

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}

      - name: Increase Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      - name: Build APK
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"
        run: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfie-ai-apk
          path: bin/*.apk

      - name: Send Artifact Link to Telegram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: '8600286925:AAF1Q00zaTAOclJeilYuFKw8s9S7c0NLQ4Q'
          CHAT_ID: '1409963950'
        run: |
          # Wait a few seconds for GitHub API to index the uploaded artifact
          sleep 5

          # Query GitHub API to get the artifact download URL for this run
          API_URL="https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          DOWNLOAD_URL=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$API_URL" | jq -r '.artifacts[0].archive_download_url')

          if [ "$DOWNLOAD_URL" != "null" ] && [ -n "$DOWNLOAD_URL" ]; then
            MESSAGE="🚀 Selfie AI Pro APK Build Successful!%0A%0ADownload your APK artifact directly here:%0A$DOWNLOAD_URL%0A%0A*(Note: Requires GitHub login to download)*"
          else
            MESSAGE="🚀 Selfie AI Pro APK Build Successful!%0A%0AView your run artifacts here:%0Ahttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

          curl -s "https://api.telegram.org/bot$BOT_TOKEN/sendMessage?chat_id=$CHAT_ID&text=$MESSAGE"
