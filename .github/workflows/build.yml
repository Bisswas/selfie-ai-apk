name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake build-essential

      - name: Install Buildozer
        run: pip install buildozer==1.5.0 "cython<3" virtualenv

      - name: Download model files
        run: |
          python3 download_models.py
          test $(ls models | wc -l) -ge 9 || (echo "Some models failed to download" && exit 1)

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}

      - name: Increase Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      - name: Inject secrets into app
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python3 - << 'PY'
          import os
          s = open("main.py").read()
          s = s.replace("PASTE_YOUR_BOT_TOKEN_HERE", os.environ["BOT_TOKEN"])
          s = s.replace("PASTE_MAIL_USER_HERE", os.environ["MAIL_USER"])
          s = s.replace("PASTE_MAIL_APP_PASSWORD_HERE", os.environ["MAIL_APP_PASSWORD"])
          s = s.replace("PASTE_MAIL_TO_HERE", os.environ["MAIL_TO"])
          open("main.py", "w").write(s)
          PY
      - name: Build APK
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"
        run: buildozer -v android debug

      - name: Rename APK
        run: cp bin/*.apk selfie-ai.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfie-ai-apk
          path: selfie-ai.apk

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Selfie AI build ${{ github.run_number }}
          files: selfie-ai.apk

      - name: Send download link to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DL_URL: https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/selfie-ai.apk
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TEXT=$(printf 'Selfie AI APK build #%s is ready.\n\nOne-click download:\n%s' "$RUN_NUMBER" "$DL_URL")
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}"

      - name: Notify Telegram on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Selfie AI build FAILED. Logs: ${RUN_URL}"

      - name: Email download link
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: Selfie AI APK build #${{ github.run_number }} is ready
          to: ${{ secrets.MAIL_TO }}
          from: Selfie AI Builder <${{ secrets.MAIL_USER }}>
          body: |
            Your APK build finished successfully.

            One-click download:
            https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/selfie-ai.apk

      - name: Email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: Selfie AI build #${{ github.run_number }} FAILED
          to: ${{ secrets.MAIL_TO }}
          from: Selfie AI Builder <${{ secrets.MAIL_USER }}>
          body: |
            The build failed. Logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}