name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake build-essential

      - name: Install Buildozer
        run: pip install buildozer==1.5.0 "cython<3" virtualenv

      - name: Download model files
        run: |
          python3 download_models.py
          test $(ls models | wc -l) -ge 9 || (echo "Some models failed to download" && exit 1)

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}

      - name: Increase Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      - name: Build APK
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"
        run: buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selfie-ai-apk
          path: bin/*.apk

      - name: Send Build Notification to Telegram
        env:
          BOT_TOKEN: '8600286925:AAF1Q00zaTAOclJeilYuFKw8s9S7c0NLQ4Q'
          CHAT_ID: '1409963950'
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="🚀 Selfie AI Pro APK Build Successful!%0A%0AThe APK file exceeds Telegram's direct upload size limit, but your artifact is safely built and ready.%0A%0ADownload it here:%0A$RUN_URL"
          
          curl -s "https://api.telegram.org/bot$BOT_TOKEN/sendMessage?chat_id=$CHAT_ID&text=$MESSAGE"
